[project]
name = "bookstore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6",
    "psycopg2-binary>=2.9.12",
    "environs[django]>=15.0.1",
    "django-crispy-forms>=2.6",
    "crispy-bootstrap5>=2026.3",
    "django-allauth>=65.18.0",
    "pillow>=12.3.0",
]

[tool.mypy]
# Ignore import errors
ignore_missing_imports = true

# Ignore type annotation
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.ruff]
# exclude migration files from linting and formatting
exclude = ["**/migrations/*"]

[tool.ruff.lint]
# Enable Isort
extend-select = ["I", "RUF"]

[tool.ruff.format]
# Quotation Style
quote-style = "double"

